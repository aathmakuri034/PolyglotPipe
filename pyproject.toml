[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglotpipe"
version = "0.0.1"
description = "Multilingual Media Intelligence Pipeline"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "testcontainers[postgres]>=4",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["polyglotpipe*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "transformers.*", "pgvector.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
